server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;          # legacy layout: the project root is the web root
    index index.php;
    client_max_body_size 16m;

    # never expose internals
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(vendor|storage|app|bootstrap|config|database|routes|resources|tests|frontend|docker|node_modules)/ { deny all; }
    location ~* ^/(artisan|server\.php|webpack\.mix\.js|package\.json|composer\.(json|lock)|Dockerfile|docker-compose\.yml)$ { deny all; }
    location ~* \.(env|sql|md|lock|log|bak|xml|ya?ml)$ { deny all; }
    location = /Instruction.txt { deny all; }

    # accept the /backend prefix when reached directly (URLs are generated with URL_PREFIX)
    location ^~ /backend/ { rewrite ^/backend/(.*)$ /$1 last; }

    location /public/media/ { expires 7d; access_log off; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 120s;
    }
}
